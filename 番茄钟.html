<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 番茄钟</title>
<style>
  :root {
    --color-focus: #E05A47;
    --color-break: #4CAF50;
    --color-bg: #1a1a2e;
    --color-surface: #16213e;
    --color-text: #e0e0e0;
    --color-text-secondary: #888;
    --color-btn-hover: rgba(255,255,255,0.1);
    --radius: 16px;
    --transition: 0.3s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
      'Microsoft YaHei', sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }

  /* Subtle background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(224,90,71,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 70%, rgba(76,175,80,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 40px 24px;
  }

  /* ── Title ── */
  .title {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 40px;
    opacity: 0.9;
  }
  .title .icon { font-size: 28px; margin-right: 6px; }

  /* ── Timer Ring ── */
  .timer-container {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto 36px;
  }

  .timer-ring {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .timer-ring .bg-circle {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 8;
  }

  .timer-ring .progress-circle {
    fill: none;
    stroke: var(--color-focus);
    stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.9s linear, stroke 0.5s ease;
  }

  .timer-ring.break .progress-circle {
    stroke: var(--color-break);
  }

  .timer-display {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .timer-time {
    font-size: 58px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    line-height: 1;
  }

  .timer-label {
    font-size: 14px;
    color: var(--color-text-secondary);
    letter-spacing: 1px;
  }

  /* ── Controls ── */
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
  }

  .btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--color-text);
    font-size: 20px;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
  }

  .btn:hover {
    background: var(--color-btn-hover);
    border-color: rgba(255,255,255,0.3);
    transform: scale(1.06);
  }

  .btn:active {
    transform: scale(0.95);
    transition: transform 0.1s ease;
  }

  .btn-start {
    width: 64px;
    height: 64px;
    font-size: 26px;
    border-color: var(--color-focus);
    color: var(--color-focus);
  }
  .btn-start:hover {
    background: rgba(224,90,71,0.15);
  }

  .btn-start.break-mode {
    border-color: var(--color-break);
    color: var(--color-break);
  }
  .btn-start.break-mode:hover {
    background: rgba(76,175,80,0.15);
  }

  /* ── Mode Switcher ── */
  .mode-switcher {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 24px;
    background: var(--color-surface);
    border-radius: 25px;
    overflow: hidden;
    padding: 3px;
  }

  .mode-btn {
    flex: 1;
    max-width: 140px;
    padding: 10px 18px;
    border: none;
    border-radius: 22px;
    background: transparent;
    color: var(--color-text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    letter-spacing: 0.5px;
    outline: none;
    white-space: nowrap;
  }

  .mode-btn.active {
    background: var(--color-focus);
    color: #fff;
    font-weight: 500;
  }
  .mode-btn.break-active.active {
    background: var(--color-break);
  }

  /* ── Stats ── */
  .stats {
    text-align: center;
    margin-bottom: 28px;
    font-size: 15px;
    color: var(--color-text-secondary);
    letter-spacing: 1px;
  }
  .stats .count { color: var(--color-focus); font-weight: 700; font-size: 20px; }

  /* ── Settings Toggle ── */
  .settings-toggle {
    display: flex;
    justify-content: center;
    margin-bottom: 0;
  }

  .settings-toggle button {
    background: transparent;
    border: none;
    color: var(--color-text-secondary);
    font-size: 13px;
    cursor: pointer;
    padding: 8px 16px;
    letter-spacing: 1px;
    transition: color var(--transition);
    outline: none;
  }

  .settings-toggle button:hover {
    color: var(--color-text);
  }

  /* ── Settings Panel ── */
  .settings-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease, padding 0.4s ease, margin 0.4s ease;
    background: var(--color-surface);
    border-radius: var(--radius);
    margin: 0 auto;
    padding: 0 24px;
  }

  .settings-panel.open {
    max-height: 200px;
    padding: 20px 24px;
    margin-top: 16px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .setting-row:last-child { margin-bottom: 0; }

  .setting-label {
    font-size: 14px;
    color: var(--color-text-secondary);
    letter-spacing: 0.5px;
  }

  .setting-control {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .setting-control input[type="range"] {
    -webkit-appearance: none;
    width: 100px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.15);
    outline: none;
  }

  .setting-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--color-focus);
    cursor: pointer;
    border: 2px solid var(--color-bg);
  }

  .setting-value {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 28px;
    text-align: right;
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: var(--color-focus);
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    letter-spacing: 1px;
    z-index: 100;
    transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
  }
  .toast.break-toast { background: var(--color-break); }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .app { padding: 24px 16px; }
    .timer-container { width: 240px; height: 240px; }
    .timer-time { font-size: 48px; }
    .btn { width: 44px; height: 44px; font-size: 17px; }
    .btn-start { width: 56px; height: 56px; font-size: 22px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Title -->
  <div class="title"><span class="icon">🍅</span>番茄钟</div>

  <!-- Timer Ring -->
  <div class="timer-container">
    <svg class="timer-ring" id="timerRing" viewBox="0 0 280 280">
      <circle class="bg-circle" cx="140" cy="140" r="130"/>
      <circle class="progress-circle" id="progressCircle"
              cx="140" cy="140" r="130"
              stroke-dasharray="816.8"
              stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display">
      <div class="timer-time" id="timerTime">25:00</div>
      <div class="timer-label" id="timerLabel">准备开始</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn" id="btnReset" title="重置">↺</button>
    <button class="btn btn-start" id="btnStart" title="开始">▶</button>
    <button class="btn" id="btnPause" title="暂停">⏸</button>
  </div>

  <!-- Mode Switcher -->
  <div class="mode-switcher">
    <button class="mode-btn active" id="btnFocus" data-mode="focus">● 专注</button>
    <button class="mode-btn" id="btnBreak" data-mode="break">○ 休息</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    今日完成：🍅 × <span class="count" id="todayCount">0</span>
  </div>

  <!-- Settings Toggle -->
  <div class="settings-toggle">
    <button id="btnSettingsToggle">⚙ 设置 ▾</button>
  </div>

  <!-- Settings Panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <span class="setting-label">专注时长</span>
      <div class="setting-control">
        <input type="range" id="focusRange" min="1" max="60" value="25" step="1">
        <span class="setting-value" id="focusValue">25分钟</span>
      </div>
    </div>
    <div class="setting-row">
      <span class="setting-label">休息时长</span>
      <div class="setting-control">
        <input type="range" id="breakRange" min="1" max="30" value="5" step="1">
        <span class="setting-value" id="breakValue">5分钟</span>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // ─── Constants ────────────────
  const CIRCUMFERENCE = 2 * Math.PI * 130; // ~816.8 (r=130)
  const STORAGE_KEY_SETTINGS = 'pomodoro_settings';
  const STORAGE_KEY_STATS = 'pomodoro_stats';

  // ─── DOM Refs ────────────────
  const $ = (sel) => document.querySelector(sel);
  const timerRing = $('#timerRing');
  const progressCircle = $('#progressCircle');
  const timerTime = $('#timerTime');
  const timerLabel = $('#timerLabel');
  const btnStart = $('#btnStart');
  const btnPause = $('#btnPause');
  const btnReset = $('#btnReset');
  const btnFocus = $('#btnFocus');
  const btnBreak = $('#btnBreak');
  const todayCount = $('#todayCount');
  const settingsPanel = $('#settingsPanel');
  const btnSettingsToggle = $('#btnSettingsToggle');
  const focusRange = $('#focusRange');
  const breakRange = $('#breakRange');
  const focusValue = $('#focusValue');
  const breakValue = $('#breakValue');
  const toast = $('#toast');

  // ─── State ────────────────────
  let settings = { focusMinutes: 25, breakMinutes: 5 };
  let mode = 'focus';       // 'focus' | 'break'
  let state = 'idle';       // 'idle' | 'running' | 'paused' | 'completed'
  let totalSeconds = 25 * 60;
  let remainingSeconds = 25 * 60;
  let timerId = null;
  let audioCtx = null;

  // ─── Persistence ─────────────
  function storageGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (_) { return fallback; }
  }

  function loadSettings() {
    settings = storageGet(STORAGE_KEY_SETTINGS, settings);
  }

  function saveSettings() {
    localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
  }

  function loadStats() {
    return storageGet(STORAGE_KEY_STATS, {});
  }

  function saveStats(stats) {
    localStorage.setItem(STORAGE_KEY_STATS, JSON.stringify(stats));
  }

  function getTodayKey() {
    return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
  }

  // ─── Stats ─────────────────────
  let todayPomodoros = 0;  // cached to avoid repeated localStorage reads

  function refreshTodayCount() {
    todayPomodoros = getTodayPomodoros();
    return todayPomodoros;
  }

  function getTodayPomodoros() {
    const stats = loadStats();
    return stats[getTodayKey()] || 0;
  }

  function incrementTodayPomodoros() {
    const stats = loadStats();
    const key = getTodayKey();
    stats[key] = (stats[key] || 0) + 1;
    saveStats(stats);
    todayPomodoros = stats[key];
    return todayPomodoros;
  }

  // ─── Audio ──────────────────
  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playBeep(freq, duration, delay) {
    const ctx = getAudioContext();
    const startTime = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(0.3, startTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration);
  }

  function playToneSequence(notes) {
    notes.forEach(([freq, dur, del]) => playBeep(freq, dur, del));
  }

  function playCompletionSound() {
    playToneSequence([[523, 0.25, 0], [659, 0.25, 0.2], [784, 0.4, 0.4]]);
  }

  function playBreakEndSound() {
    playToneSequence([[784, 0.25, 0], [659, 0.25, 0.2], [523, 0.4, 0.4]]);
  }

  // ─── Timer Logic ────────────
  function setTotalFromSettings() {
    if (mode === 'focus') {
      totalSeconds = settings.focusMinutes * 60;
    } else {
      totalSeconds = settings.breakMinutes * 60;
    }
    remainingSeconds = totalSeconds;
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function updateProgress() {
    progressCircle.style.strokeDashoffset = CIRCUMFERENCE * (1 - remainingSeconds / totalSeconds);
  }

  function updateDisplay() {
    timerTime.textContent = formatTime(remainingSeconds);
    updateProgress();

    if (state === 'running') {
      timerLabel.textContent = mode === 'focus' ? '专注中…' : '休息中…';
    } else if (state === 'paused') {
      timerLabel.textContent = '已暂停';
    } else if (state === 'completed') {
      timerLabel.textContent = mode === 'focus' ? '番茄完成！' : '休息结束！';
    } else {
      timerLabel.textContent = '准备开始';
    }
  }

  function updateModeButtons() {
    btnFocus.classList.toggle('active', mode === 'focus');
    btnBreak.classList.toggle('active', mode === 'break');
    // Swap break-active class for mode switcher
    btnFocus.classList.toggle('break-active', mode === 'break');
    btnBreak.classList.toggle('break-active', mode === 'break');
  }

  function updateRingClass() {
    timerRing.classList.toggle('break', mode === 'break');
    btnStart.classList.toggle('break-mode', mode === 'break');
  }

  function updateStatsDisplay() {
    todayCount.textContent = todayPomodoros;
  }

  function resetToMode(newMode) {
    mode = newMode;
    state = 'idle';
    clearInterval(timerId);
    timerId = null;
    setTotalFromSettings();
    updateAll();
  }

  function updateAll() {
    updateDisplay();
    updateModeButtons();
    updateRingClass();
    updateStatsDisplay();
  }

  function tick() {
    remainingSeconds--;
    updateDisplay();

    if (remainingSeconds <= 0) {
      complete();
    }
  }

  function start() {
    if (state === 'running') return;

    // If completed, reset first then start
    if (state === 'completed') {
      resetTimer();
    }

    // Resume audio context on user gesture (browser policy)
    getAudioContext();

    state = 'running';
    timerId = setInterval(tick, 1000);
    updateDisplay();
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    clearInterval(timerId);
    timerId = null;
    updateDisplay();
  }

  function resetTimer() {
    state = 'idle';
    clearInterval(timerId);
    timerId = null;
    setTotalFromSettings();
    updateAll();
  }

  function complete() {
    state = 'completed';
    clearInterval(timerId);
    timerId = null;
    remainingSeconds = 0;
    updateDisplay();

    if (mode === 'focus') {
      const count = incrementTodayPomodoros();
      updateStatsDisplay();
      playCompletionSound();
      showToast('🍅 番茄完成！今日已 ' + count + ' 个', false);
    } else {
      playBreakEndSound();
      showToast('☕ 休息结束，继续加油！', true);
    }

    // Auto-reset after 3 seconds
    setTimeout(() => {
      if (state === 'completed') {
        resetTimer();
      }
    }, 3000);
  }

  // ─── Toast ──────────────────
  let toastTimeout;
  function showToast(msg, isBreak) {
    clearTimeout(toastTimeout);
    toast.textContent = msg;
    toast.classList.remove('break-toast');
    if (isBreak) toast.classList.add('break-toast');
    toast.classList.add('show');
    toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // ─── Settings ───────────────
  function applySettingsToUI() {
    focusRange.value = settings.focusMinutes;
    breakRange.value = settings.breakMinutes;
    focusValue.textContent = settings.focusMinutes + '分钟';
    breakValue.textContent = settings.breakMinutes + '分钟';
  }

  function handleSettingChange() {
    settings.focusMinutes = parseInt(focusRange.value);
    settings.breakMinutes = parseInt(breakRange.value);
    saveSettings();
    focusValue.textContent = settings.focusMinutes + '分钟';
    breakValue.textContent = settings.breakMinutes + '分钟';

    if (state === 'idle') {
      setTotalFromSettings();
      updateAll();
    }
  }

  // Shared live-preview for both range inputs
  function handleRangeInput(range, valueEl) {
    valueEl.textContent = range.value + '分钟';
  }

  function toggleSettings() {
    const isOpen = settingsPanel.classList.toggle('open');
    btnSettingsToggle.textContent = isOpen ? '⚙ 设置 ▴' : '⚙ 设置 ▾';
  }

  // ─── Event Binding ──────────
  btnStart.addEventListener('click', start);
  btnPause.addEventListener('click', pause);
  btnReset.addEventListener('click', resetTimer);

  btnFocus.addEventListener('click', () => {
    if (mode !== 'focus' || state === 'completed') resetToMode('focus');
  });

  btnBreak.addEventListener('click', () => {
    if (mode !== 'break' || state === 'completed') resetToMode('break');
  });

  btnSettingsToggle.addEventListener('click', toggleSettings);

  focusRange.addEventListener('input', () => handleRangeInput(focusRange, focusValue));
  focusRange.addEventListener('change', handleSettingChange);

  breakRange.addEventListener('input', () => handleRangeInput(breakRange, breakValue));
  breakRange.addEventListener('change', handleSettingChange);

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input')) return; // Don't capture when typing in inputs
    switch (e.code) {
      case 'Space':
        e.preventDefault();
        if (state === 'running') pause();
        else start();
        break;
      case 'KeyR':
        resetTimer();
        break;
      case 'Digit1':
        resetToMode('focus');
        break;
      case 'Digit2':
        resetToMode('break');
        break;
    }
  });

  // ─── Init ────────────────────
  function init() {
    loadSettings();
    applySettingsToUI();
    progressCircle.style.strokeDasharray = CIRCUMFERENCE;
    resetToMode('focus');
    refreshTodayCount();
    updateStatsDisplay();
  }

  init();
})();
</script>

</body>
</html>
